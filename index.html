
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#f8eeee">
    <meta name="description" content="İkimizin Arasında — Birbirimizi dinlemek, anlamak ve yeniden keşfetmek için bize özel bir alan.">

    <title>İkimizin Arasında ♡</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="welcome">

        <div class="welcome-content">

            <p class="subtitle">
                SADECE İKİMİZE ÖZEL
            </p>

            <h1>
                İkimizin Arasında
            </h1>

            <p class="quote">
                Bazen anlamak, anlatmaktan daha güzeldir.
            </p>

            <div class="heart-divider" aria-hidden="true">
                <span>♡</span>
            </div>

            <p class="description">
                Burası birbirimizi dinlemek, anlamak
                ve yeniden keşfetmek için bizim küçük alanımız.
            </p>

            <button
                type="button"
                class="start-button"
                onclick="startJourney()"
            >
                Birlikte keşfedelim
                <span aria-hidden="true">→</span>
            </button>

            <p class="footer-text">
                Sen ve ben, aynı hikâyenin iki farklı satırı.
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
